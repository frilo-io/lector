<style>
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/newsreader-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/newsreader-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/newsreader-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/newsreader-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/newsreader-latin-ext-400-italic.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/newsreader-latin-400-italic.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout idea: two views. A library that is only covers, and a page that is only text. One floating control. */
:root{
  --bg:#f0f0f0; --card:#ffffff; --ink:#0c0c0c; --dim:#8c8c8c; --faint:#e2e2e2; --accent:#e5372c;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -6px rgba(0,0,0,.16);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --spring:cubic-bezier(.2,1.25,.35,1); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0a0a0a; --card:#161616; --ink:#f1f1f1; --dim:#7c7c7c; --faint:#2b2b2b; --accent:#ff4d3f; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -6px rgba(0,0,0,.7); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0a0a0a; --card:#161616; --ink:#f1f1f1; --dim:#7c7c7c; --faint:#2b2b2b; --accent:#ff4d3f; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -6px rgba(0,0,0,.7); color-scheme:dark; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --mark:rgba(255,200,60,.26); } }
:root{ --mark:rgba(255,196,0,.34); }
:root[data-theme="dark"]{ --mark:rgba(255,200,60,.26); }
/* The reader's own choice wins over the system: set by the theme control, per device. */
:root[data-mode="light"]{ --bg:#f0f0f0; --card:#ffffff; --ink:#0c0c0c; --dim:#8c8c8c; --faint:#e2e2e2; --accent:#e5372c; --mark:rgba(255,196,0,.34); --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -6px rgba(0,0,0,.16); color-scheme:light; }
:root[data-mode="dark"]{ --bg:#0a0a0a; --card:#161616; --ink:#f1f1f1; --dim:#7c7c7c; --faint:#2b2b2b; --accent:#ff4d3f; --mark:rgba(255,200,60,.26); --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -6px rgba(0,0,0,.7); color-scheme:dark; }

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none;scrollbar-width:none}
html::-webkit-scrollbar,#sheet::-webkit-scrollbar{display:none}
#sheet{scrollbar-width:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;transition:background .4s}
body.reading{background:var(--card)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- library ---------- */
#home{max-width:920px;margin:0 auto;padding:calc(clamp(64px,9vw,88px) + env(safe-area-inset-top)) clamp(20px,5vw,40px) 120px;display:flex;flex-direction:column;gap:clamp(40px,6vw,64px)}
.hero{display:grid;grid-template-columns:clamp(96px,22vw,168px) 1fr;gap:clamp(18px,4vw,36px);align-items:center;width:100%;text-align:left;background:var(--card);border-radius:32px;padding:clamp(18px,3.5vw,32px);transition:transform .5s var(--spring)}
.hero:hover{transform:scale(1.008)}
.hero:active{transform:scale(.99)}
.hero .cover{transform:rotate(-2.5deg);transition:transform .6s var(--spring)}
.hero:hover .cover{transform:rotate(0deg) scale(1.03)}
.htext{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;align-self:stretch;justify-content:center}
.ht{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3.4vw,32px);line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.ha{color:var(--dim);font-size:14px}
.hx{font-family:var(--serif);font-size:clamp(15px,1.9vw,17px);line-height:1.5;color:var(--dim);margin-top:12px;max-height:6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 15%,transparent 74%);mask-image:linear-gradient(#000 15%,transparent 74%)}
.pill{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;height:40px;padding:0 16px 0 11px;border-radius:999px;background:var(--bg);font-family:var(--serif);font-size:18px;margin-top:-18px;position:relative}
.ring{width:20px;height:20px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .t{stroke:var(--faint)}
.ring .v{stroke:var(--accent);stroke-linecap:round}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,20vw,136px),1fr));gap:clamp(28px,5vw,44px) clamp(20px,4vw,36px);align-items:end}
.book{position:relative;display:flex;flex-direction:column;gap:10px;cursor:pointer;animation:rise .6s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.cover{display:block;width:100%;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--faint);box-shadow:var(--shadow);transition:transform .55s var(--spring),box-shadow .4s;transform-origin:50% 100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.book:hover .cover{transform:translateY(-8px) rotate(-1.6deg)}
.book:active .cover{transform:scale(.97)}
.gen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10%;color:#fff;font-family:var(--serif);line-height:1.08}
.gen b{font-weight:400;font-size:clamp(14px,2.4vw,19px);letter-spacing:-.01em;overflow-wrap:anywhere}
.gen span{font-family:var(--ui);font-size:10px;opacity:.75}
.prog{height:2px;border-radius:2px;background:var(--faint);overflow:hidden}
.prog:empty{background:none}
.prog i{display:block;height:100%;background:var(--ink);border-radius:2px}
.rm{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;line-height:24px;text-align:center;opacity:0;transform:scale(.6);transition:.25s var(--spring)}
.book:hover .rm,.rm:focus-visible{opacity:1;transform:none}
@media(hover:none){.rm{display:none}}
.add .cover{background:var(--card);box-shadow:none;display:grid;place-items:center}
.add .cover::before{content:"";width:22px;height:22px;background:linear-gradient(var(--dim),var(--dim)) 50%/100% 1.5px no-repeat,linear-gradient(var(--dim),var(--dim)) 50%/1.5px 100% no-repeat;transition:transform .5s var(--spring)}
.add:hover .cover::before{transform:rotate(90deg) scale(1.15)}
.add .prog{background:none}
.first{font-family:var(--serif);font-size:clamp(28px,5vw,44px);letter-spacing:-.02em;line-height:1.05;color:var(--dim)}
.first b{font-weight:400;color:var(--ink)}

/* ---------- page ---------- */
#bar{position:fixed;inset:env(safe-area-inset-top) 0 auto 0;height:2px;z-index:30;pointer-events:none}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s var(--ease)}
#back{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:25;color:var(--dim);transition:opacity .4s,color .2s}
#back:hover{color:var(--ink)}
#theme{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:25;color:var(--dim);transition:opacity .4s,color .2s}
#theme:hover{color:var(--ink)}
#theme svg{width:18px;height:18px}
#theme path{transition:opacity .35s}
#theme[data-t="light"] path{opacity:0}
#theme[data-t="auto"] .l{opacity:0}
body.playing:not(.peek) #theme{opacity:0;pointer-events:none}
html.theming::view-transition-old(root){animation:none}
html.theming::view-transition-new(root){animation:reveal .7s var(--ease)}
@keyframes reveal{from{clip-path:circle(0 at var(--rx) var(--ry))}to{clip-path:circle(150vmax at var(--rx) var(--ry))}}
#reader{touch-action:pan-y}
#page{position:relative;max-width:34em;margin:0 auto;padding:calc(clamp(72px,12vh,128px) + env(safe-area-inset-top)) 24px 240px;font-family:var(--serif);font-size:var(--fs,21px);line-height:1.6}
#page p{margin:0 0 .85em;text-wrap:pretty}
#page p.li{padding-left:1.1em}
#page .quote{font-style:italic;padding-left:1.1em}
#page h2{font-size:1.7em;line-height:1.12;font-weight:400;letter-spacing:-.018em;margin:1.2em 0 .9em;text-wrap:balance}
#page h3{font-size:1.2em;font-weight:500;margin:1.4em 0 .5em;text-wrap:balance}
#page h2:first-child{margin-top:0}
#page pre{font:.7em/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0 0 1em;overflow-x:auto}
#page hr{border:0;height:2.2em}
#page img{display:block;max-width:100%;max-height:72vh;margin:1.6em auto;border-radius:4px}
.s{cursor:pointer;transition:color .45s,background-color .6s}
body.playing #page .s,body.held #page .s{color:var(--dim)}
body.playing #page .s.on,body.held #page .s.on{color:var(--ink)}
#page .hl .s{background-color:var(--mark)}
#here{position:absolute;left:8px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;transition:top .45s var(--ease),opacity .3s}
@media(hover:none){#page{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
@media(hover:hover){body:not(.playing):not(.held) .s:hover{color:var(--accent)}}
#next{display:grid;place-items:center;width:48px;height:48px;margin:2.4em auto 0;border-radius:50%;background:var(--bg);color:var(--dim)}
#next:hover{color:var(--ink)}

/* ---------- control ---------- */
#dock{position:fixed;left:50%;transform:translateX(-50%);z-index:26;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px;border-radius:999px;isolation:isolate}
#dock::before{content:"";position:absolute;inset:0;border-radius:999px;background:var(--bg);box-shadow:var(--shadow);z-index:-1;transition:opacity .4s}
/* Both sides share one width, so the play button never moves when they open or close. */
.side{display:flex;align-items:center;overflow:hidden;max-width:220px;transition:max-width .5s var(--ease),opacity .3s}
.side.l{justify-self:end}
.side.r{justify-self:start}
.x{flex:none;height:44px;display:grid;place-items:center;white-space:nowrap;padding:0 14px;font-size:15px;color:var(--ink)}
.x:hover{color:var(--accent)}
#rateBtn{font-variant-numeric:tabular-nums;color:var(--dim)}
body.playing:not(.peek) .side{max-width:0;opacity:0}
body.playing:not(.peek) #back{opacity:0;pointer-events:none}
#dot{position:relative;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;margin:0 2px;transition:transform .3s var(--spring),scale .45s var(--spring)}
#dot:active{transform:scale(.9)}
#dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);opacity:calc(var(--amp,0)*.9);transform:scale(calc(1.12 + var(--amp,0)*.55));pointer-events:none}
#dot svg{width:16px;height:16px;grid-area:1/1;transition:opacity .2s,transform .3s var(--spring)}
#dot .pa{opacity:0;transform:scale(.5)}
body.playing #dot .pl{opacity:0;transform:scale(.5)}
body.playing #dot .pa{opacity:1;transform:none}
#dot.busy::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--accent);animation:spin .8s linear infinite}
body.sys.playing #dot::after{animation:breathe 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.7;transform:scale(1.5)}}
#status{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 70px);transform:translateX(-50%);z-index:26;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;transition:opacity .4s}
#status:empty{opacity:0}

/* ---------- the orb: --z runs from 0 (text) to 1 (no text, only the voice) ---------- */
@property --z{syntax:'<number>';inherits:true;initial-value:0}
html.zsnap{transition:--z .7s var(--ease)}
html.zing #page{opacity:calc(1 - var(--z));filter:blur(calc(var(--z) * 14px));transform:scale(calc(1 - var(--z) * .05));transform-origin:50% 45vh}
html.zen #page{visibility:hidden}
html.zen .side{max-width:0;opacity:0}
html.zen body.playing #dot svg{opacity:0}
#dock{bottom:calc(max(18px,env(safe-area-inset-bottom)) + var(--z) * (50dvh - 62px))}
#dock::before{opacity:calc(1 - var(--z))}
#dot{scale:calc((1 + var(--z) * 2.6) * var(--k,1))}
body.playing:not(.peek) #dot{--k:.78}
html.zing #dot{--k:1;transition:transform .3s var(--spring)}
body.playing:not(.peek) #dock::before{opacity:0}
#dot::after{border-width:calc(1.5px / (1 + var(--z) * 2.6))}
.orb{position:absolute;inset:-55%;border-radius:50%;z-index:-1;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 70%,transparent) 0,color-mix(in srgb,var(--accent) 22%,transparent) 38%,transparent 68%);opacity:calc(var(--z) * (.35 + var(--amp,0) * .65));transform:scale(calc(.82 + var(--amp,0) * .5));transition:transform .12s linear}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
#sheet{position:fixed;left:50%;bottom:8px;width:min(480px,calc(100vw - 16px));max-height:min(72vh,640px);transform:translate(-50%,calc(100% + 24px));z-index:41;background:var(--card);border-radius:28px;box-shadow:0 24px 80px -12px rgba(0,0,0,.4);overflow:auto;padding:14px 8px;overscroll-behavior:contain;visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s}
body.sheet #scrim{opacity:1;pointer-events:auto}
body.sheet #sheet{transform:translate(-50%,0);visibility:visible;transition:transform .55s var(--ease)}
.row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;padding:11px 16px;border-radius:14px;font-family:var(--serif);font-size:19px;line-height:1.25}
.row:hover{background:var(--bg)}
.row i{flex:none;width:7px;height:7px;border-radius:50%;background:transparent;transform:translateY(-2px)}
.row.on i{background:var(--accent)}
.row span{flex:1;min-width:0}
.row small{font-family:var(--ui);font-size:12px;color:var(--dim)}
.row.d1{padding-left:34px;font-size:17px;color:var(--dim)}
.row.d1:hover,.row.d1.on{color:var(--ink)}
.seg{display:flex;gap:20px;padding:6px 16px 12px;font-size:13px;color:var(--dim)}
.seg .on{color:var(--ink)}
.row.note span{font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

body.dragging::after{content:"";position:fixed;inset:0;z-index:60;background:linear-gradient(var(--ink),var(--ink)) 50%/56px 1.5px no-repeat,linear-gradient(var(--ink),var(--ink)) 50%/1.5px 56px no-repeat,color-mix(in srgb,var(--bg) 90%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bar"><i></i></div>

<button id="theme" aria-label="Theme" data-t="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path class="r" d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/><path class="l" d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg></button>
<main id="home"><div id="hero"></div><div id="grid"></div></main>

<main id="reader" hidden>
  <button id="back" aria-label="Library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <article id="page"></article>
</main>

<div id="status" role="status"></div>
<div id="dock" hidden>
  <div class="side l">
    <button class="x" id="tocBtn" aria-label="Contents"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 8h14M5 16h9"/></svg></button>
    <button class="x" id="rateBtn" aria-label="Speed"></button>
  </div>
  <button id="dot" aria-label="Play">
    <svg class="pl" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.4v11.2L14 8z"/></svg>
    <svg class="pa" viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
    <i class="orb"></i>
  </button>
  <div class="side r"><button class="x" id="voiceBtn" aria-label="Voice"></button></div>
</div>

<div id="scrim"></div>
<section id="sheet" aria-hidden="true"></section>
<input type="file" id="file" accept=".epub,application/epub+zip" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const OPS = 'http://www.idpf.org/2007/ops', XLINK = 'http://www.w3.org/1999/xlink';

/* ---------- voices ---------- */
// One voice engine: Kokoro. Languages it does not speak use the device's own voice.
const K_VOICES = {

  const score = v => { let s = 0; const n = v.name, vl = (v.lang || '').toLowerCase().replace('_', '-');
    if(vl === bl) s += 40; else if(vl.slice(0, 2) === bl.slice(0, 2)) s += 30;
    if(/natural|neural/i.test(n)) s += 14; if(/premium/i.test(n)) s += 13; if(/enhanced/i.test(n)) s += 11; if(/^google/i.test(n)) s += 8;
    if(/(compact|espeak|bad news|bells|boing|bubbles|cellos|jester|organ|trinoids|zarvox|superstar|wobble|albert|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|whisper)/i.test(n)) s -= 30;
    return s; };
  const list = synth.getVoices().filter(v => (v.lang || '').slice(0, 2).toLowerCase() === bl.slice(0, 2)).sort((a, b) => score(b) - score(a));
  const saved = prefs.voice['sys:' + fam()];
  sysVoice = list.find(v => v.name === saved) || list[0] || null; return list;
}
if(synth) synth.onvoiceschanged = () => { if(S.book && !useNeural()) setEngine(); };
function runSystem(){
  const t = ++S.token; S.mode = 'system'; document.body.classList.add('sys');
  if(!synth){ setPlaying(false); return say('This browser has no voice.', 4000); }
  const next = async () => {
    if(t !== S.token) return; synth.cancel();
    const s = S.sents[S.idx];
    if(!s){ if(await advance(t)) next(); return; }
    mark(S.idx); savePos();
    if(!/[\p{L}\p{N}]/u.test(s.text)){ S.idx++; return next(); }
    const u = new SpeechSynthesisUtterance(s.text); if(sysVoice){ u.voice = sysVoice; u.lang = sysVoice.lang; } else u.lang = S.lang; u.rate = prefs.rate;
    u.onend = () => { if(t === S.token){ S.idx++; next(); } };
    u.onerror = e => { if(t === S.token && e.error !== 'interrupted' && e.error !== 'canceled'){ S.idx++; next(); } };
    setTimeout(() => t === S.token && synth.speak(u), 40);
  };
  next();
}

/* ---------- controls ---------- */
function setEngine(){
  let name;
  if(useNeural()) name = voice().name;
  else { pickSys(); name = sysVoice ? sysVoice.name.replace(/^(Microsoft|Google) /, '').replace(/ Online.*| \(.*/, '') : 'Voice'; }
  $('#voiceBtn').textContent = name;
  $('#rateBtn').textContent = fmtRate(prefs.rate);
}
$('#dot').onclick = () => S.playing ? pause() : play();
const fmtRate = r => String(r).replace(/^0/, '') + '×';
function setRate(r){ if(r === prefs.rate) return; prefs.rate = r; savePrefs(); setEngine(); TTS.trim(); if(S.playing || S.paused) jump(S.idx); else TTS.fill(); }
$('#rateBtn').onclick = () => openSheet(sh => RATES.forEach(r => { const b = row(fmtRate(r), '', r === prefs.rate); b.onclick = () => { closeSheet(); setRate(r); }; sh.appendChild(b); }));
let statusTimer = null;
function say(msg, ms = 3000){ $('#status').textContent = msg; clearTimeout(statusTimer); if(msg && ms) statusTimer = setTimeout(() => $('#status').textContent = '', ms); }
let peekTimer = null;
function peek(){ document.body.classList.add('peek'); clearTimeout(peekTimer); peekTimer = setTimeout(() => document.body.classList.remove('peek'), 2600); }
addEventListener('pointermove', e => { if(e.pointerType === 'mouse' && (e.clientY > innerHeight - 130 || e.clientY < 90)) peek(); }, { passive:true });
addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse' || e.target.closest('#dock')) peek(); }, { passive:true });

function openSheet(build){ const sh = $('#sheet'); sh.innerHTML = ''; build(sh); sh.scrollTop = 0; document.body.classList.add('sheet'); sh.setAttribute('aria-hidden', 'false'); const on = sh.querySelector('.on'); if(on) on.scrollIntoView({ block:'center' }); }
function closeSheet(){ document.body.classList.remove('sheet'); $('#sheet').setAttribute('aria-hidden', 'true'); }
$('#scrim').onclick = closeSheet;
const row = (label, meta, on, cls = '') => { const r = el('button', 'row ' + cls + (on ? ' on' : ''), `<i></i><span>${esc(label)}</span>${meta ? `<small>${esc(meta)}</small>` : ''}`); return r; };

function buildToc(sh, tab){
  sh.innerHTML = ''; const hl = S.book.hl || [];
  if(hl.length){ const seg = el('div', 'seg'); for(const [k, label] of [['toc', 'Contents'], ['hl', 'Highlights']]){ const b = el('button', k === tab ? 'on' : '', label); b.onclick = () => buildToc(sh, k); seg.appendChild(b); } sh.appendChild(seg); }
  if(tab === 'hl'){
    [...hl].sort((a, b) => a.ch - b.ch || a.p - b.p).forEach(h => { const r = el('button', 'row note', `<i></i><span>${esc(h.text)}</span>`); r.onclick = () => { closeSheet(); goMark(h); }; sh.appendChild(r); });
    return;
  }
  const list = S.toc.length ? S.toc : S.spine.map((s, i) => ({ label:String(i + 1), ch:i, depth:0 }));
  let cur = -1; list.forEach((t, k) => { if(t.ch <= S.ch) cur = k; });
  list.forEach((t, k) => { const r = row(t.label, '', k === cur, t.depth ? 'd1' : ''); r.onclick = () => { closeSheet(); goChapter(t.ch, t.frag); }; sh.appendChild(r); });
}
$('#tocBtn').onclick = () => openSheet(sh => buildToc(sh, 'toc'));
const SAMPLES = new Map();
function sample(v){
  const key = 'k-' + v.id;
  if(!SAMPLES.has(key)) SAMPLES.set(key, fetch('tts/samples/' + key + '.mp3').then(r => { if(!r.ok) throw new Error(r.status); return r.blob(); }).catch(e => { SAMPLES.delete(key); throw e; }));
  return SAMPLES.get(key);
}
function buildVoices(sh){
  const cur = voice();
  voicesFor(fam()).forEach(v => { const r = row(v.name, v.tag, vkey(v) === vkey(cur));
    r.onclick = async () => { prefs.voice[fam()] = vkey(v); savePrefs(); setEngine(); sh.querySelectorAll('.row').forEach(x => x.classList.toggle('on', x === r));
      halt(); TTS.trim(); unlock(); TTS.start();
      try{ const t = S.token; const b = await sample(v); if(t !== S.token) return; playClip(b); TTS.fill(); }catch(e){ console.warn(e); say('That sample would not play.'); } };
    sh.appendChild(r); });
}
$('#voiceBtn').onclick = () => openSheet(sh => {
  if(useNeural()) return buildVoices(sh);
  const list = pickSys() || [];
  if(!list.length) sh.appendChild(row('No voice for this language', '', false));
  list.forEach(v => { const r = row(v.name.replace(/^Microsoft /, ''), v.lang, v === sysVoice); r.onclick = () => { prefs.voice['sys:' + fam()] = v.name; savePrefs(); setEngine(); closeSheet(); if(S.playing) jump(S.idx); }; sh.appendChild(r); });
});

addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(document.body.classList.contains('sheet')) closeSheet(); else if(prefs.zen && S.book) exitZen(); else if(S.book) closeBook(); return; }
  if(!S.book || document.body.classList.contains('sheet') || e.metaKey || e.ctrlKey) return;
  if(e.code === 'Space'){ e.preventDefault(); S.playing ? pause() : play(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? goChapter(S.ch + 1) : step(1); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); e.shiftKey ? goChapter(S.ch - 1) : step(-1); }
});
try{ const ms = navigator.mediaSession; for(const [k, f] of [['play', play], ['pause', pause], ['previoustrack', () => step(-1)], ['nexttrack', () => step(1)], ['seekbackward', () => step(-1)], ['seekforward', () => step(1)]]){ try{ ms.setActionHandler(k, f); }catch(e){} } }catch(e){}

/* ---------- readout for troubleshooting: add #debug to the address ---------- */
if(location.hash === '#debug'){
  const d = el('pre'); d.style.cssText = 'position:fixed;top:60px;right:8px;z-index:99;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);padding:10px 12px;border-radius:10px;pointer-events:none;white-space:pre';
  document.body.appendChild(d);
  setInterval(() => { const st = TTS.stats, inf = TTS.info;
    d.textContent = ['engine ' + (TTS.engine || 'none') + ' ' + TTS.state + (inf ? '  load ' + inf.loadMs + ' ms  cache ' + inf.cached + '/' + inf.files + '  threads ' + inf.threads : ''),
      st ? 'last clip  ' + st.steps + ' steps  ' + st.rtf.toFixed(2) + ' s per s of speech  ' + Math.round(st.ms) + ' ms' : 'no clip yet',
      'ready ahead ' + TTS.ahead().toFixed(0) + ' s  clips ' + TTS.cache.size + '  queued ' + TTS.pend.size,
      'mode ' + S.mode + '  playing ' + S.playing + '  audio ' + (player.paused ? 'paused' : 'running') + (S.paused ? ' (held)' : '') + '  sentence ' + S.idx + '/' + S.sents.length,
      'isolated ' + self.crossOriginIsolated + '  cores ' + navigator.hardwareConcurrency + '  gpu ' + !!navigator.gpu].join('\n'); }, 400);
}

/* ---------- boot ---------- */
renderHome();
DB.all().then(list => {
  if(list.length){ LIB = list.concat(LIB.filter(b => !list.some(x => x.id === b.id))); }
  for(const b of LIB){ const lp = store.get('lector:pos:' + b.id); if(lp && (lp.t || 0) >= (b.posT || 0)){ b.pos = { ch:lp.ch, idx:lp.idx }; if(lp.progress) b.progress = lp.progress; b.last = Math.max(b.last || 0, lp.t || 0); } }
  if(!S.book) renderHome();
  const open = store.get('lector:open'); if(open && !S.book && LIB.some(b => b.id === open)) openBook(open);
  repairCovers();
});
// The service worker makes the app work offline and unlocks multi-threaded voice synthesis. The first visit reloads once to switch it on.
if('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  navigator.serviceWorker.register('sw.js').then(() => {
    let done = false; try{ done = !!sessionStorage.getItem('lector:coi'); }catch(e){}
    if(self.crossOriginIsolated || done) return;
    const again = () => { try{ sessionStorage.setItem('lector:coi', '1'); }catch(e){} location.reload(); };
    if(navigator.serviceWorker.controller) again(); else navigator.serviceWorker.addEventListener('controllerchange', again, { once:true });
  }).catch(() => {});
}
window.__lector = { S, TTS, LIB:() => LIB, prefs, player };
</script>
</body>
